":"Вопрос 2. Что говорится в разделе «круги кровообращения»?","answer":["Сердечно-сосудистая система человека работает по принципу двух взаимосвязанных кругов кровообращения. Благодаря их согласованной работе органы и ткани получают кислород и необходимые вещества, а кровь возвращается к сердцу для продолжения следующего цикла."]},{"section":"КНИГА №1. 9.1. СЕРДЦЕ — НАСОС, НО НЕ ЕДИНСТВЕННЫЙ УЧАСТНИК КРОВООБРАЩЕНИЯ","part":"","question":"Вопрос 3. Что говорится в разделе «малый круг кровообращения»?","answer":["Малый, или лёгочный, круг кровообращения начинается в правом желудочке сердца. Венозная кровь направляется по лёгочным артериям к лёгким."]},{"section":"КНИГА №1. 9.1. СЕРДЦЕ — НАСОС, НО НЕ ЕДИНСТВЕННЫЙ УЧАСТНИК КРОВООБРАЩЕНИЯ","part":"","question":"Вопрос 4. Что говорится в разделе «большой круг кровообращения»?","answer":["Большой, или системный, круг начинается в левом желудочке. Отсюда кровь через аорту и артерии направляется к органам и тканям."]},{"section":"КНИГА №1. 9.1. СЕРДЦЕ — НАСОС, НО НЕ ЕДИНСТВЕННЫЙ УЧАСТНИК КРОВООБРАЩЕНИЯ","part":"","question":"Вопрос 5. Почему это важно?","answer":["Но кровообращение зависит не только от способности сердца сокращаться. Особенно хорошо это видно на примере венозного возврата — движения крови по венам обратно к сердцу."]},{"section":"КНИГА №1. 9.1. СЕРДЦЕ — НАСОС, НО НЕ ЕДИНСТВЕННЫЙ УЧАСТНИК КРОВООБРАЩЕНИЯ","part":"","question":"Вопрос 6. Что говорится в разделе «кто ещё помогает крови двигаться»?","answer":["Это главный двигатель кровообращения. Оно создаёт давление и поддерживает непрерывный поток крови."]},{"section":"КНИГА №1. 9.1. СЕРДЦЕ — НАСОС, НО НЕ ЕДИНСТВЕННЫЙ УЧАСТНИК КРОВООБРАЩЕНИЯ","part":"","question":"Вопрос 7. Что говорится в разделе «диафрагма и венозный возврат»?","answer":["Диафрагма прежде всего является главной дыхательной мышцей. На вдохе она сокращается и опускается."]},{"section":"КНИГА №1. 9.1. СЕРДЦЕ — НАСОС, НО НЕ ЕДИНСТВЕННЫЙ УЧАСТНИК КРОВООБРАЩЕНИЯ","part":"","question":"Вопрос 8. Что говорится в разделе «мышечно-венозная помпа ног»?","answer":["Мы уже много работали со стопами, голенями и ногами. Теперь появляется ещё одна причина вспомнить о них."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 1. Почему дыхание нельзя отделять от движения грудной клетки?","answer":["Лёгкие — главный газообменный орган. Они принимают кислород из воздуха и передают его в кровь, а из крови забирают углекислый газ, который затем выводится наружу."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 2. Что говорится в разделе «два главных компонента дыхательного движения»?","answer":["Во время дыхания объём грудной клетки изменяется благодаря согласованной работе диафрагмы, рёбер и дыхательных мышц. Для понимания нашей дальнейшей работы особенно важны два компонента."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 3. Что говорится в разделе «движение рёбер»?","answer":["При вдохе рёбра поднимаются и расходятся. Грудная клетка увеличивается в переднезаднем и поперечном направлениях."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 4. Что говорится в разделе «движение диафрагмы»?","answer":["Диафрагма — главная дыхательная мышца. Она отделяет грудную полость от брюшной и имеет форму двух куполов."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 5. Почему мы начали с «дыхания животом»?","answer":["В главе 6 мы специально начинали не со сложной работы с рёбрами, а с «Дыхания животом». Это был первый этаж обучения дыхательному движению."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 6. Что говорится в разделе «кто заставляет лёгкие дышать»?","answer":["Дыхательные движения обеспечиваются работой дыхательной мускулатуры и изменением объёма грудной клетки."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 7. Что говорится в разделе «мышцы вдоха»?","answer":["Главную роль при спокойном вдохе играет диафрагма. Вместе с ней работают наружные межрёберные мышцы."]},{"section":"КНИГА №1. 9.2. ЛЁГКИЕ — ГЛАВНЫЙ ГАЗООБМЕННЫЙ ОРГАН","part":"","question":"Вопрос 8. Что говорится в разделе «мышцы выдоха»?","answer":["При спокойном дыхании выдох обычно не требует большого мышечного усилия. Лёгкие и грудная клетка стремятся вернуться к исходному объёму за счёт своих эластических свойств."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 1. Что говорится в разделе «грудная клетка — не коробка»?","answer":["Посмотрите на грудную клетку не как на неподвижную коробку, внутри которой лежат органы. На выдохе происходит обратное движение."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 2. Что говорится в разделе «грудина — передняя опора грудной клетки»?","answer":["Грудина находится по средней линии передней поверхности грудной клетки. С ней через хрящевые соединения связана значительная часть рёбер."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 3. Что говорится в разделе «рёбра — подвижный каркас»?","answer":["Сзади они связаны с грудными позвонками. Спереди большинство из них прямо или косвенно связано с грудиной через рёберные хрящи."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 4. Что говорится в разделе «диафрагма — граница двух этажей»?","answer":["Диафрагма занимает в нашем «телесном здании» особое место. Она находится между грудной и брюшной полостями."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 5. Что говорится в разделе «плечевой пояс»?","answer":["Есть ещё один участник, которого легко забыть. Лопатки движутся по поверхности грудной клетки."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 6. Что говорится в разделе «первичная проверка перекрёстка 3»?","answer":["Перед практической работой сначала посмотрим, что есть сейчас. Не пытайтесь специально выпрямиться."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 7. Что говорится в разделе «проверяем движение туловища»?","answer":["Теперь медленно поверните туловище немного вправо. Затем сделайте небольшой боковой наклон вправо."]},{"section":"КНИГА №1. 9.3. ПЕРЕКРЁСТОК 3 — «МОТОР И ВЕНТИЛЯЦИЯ»","part":"","question":"Вопрос 8. Что говорится в разделе «правая и левая стороны»?","answer":["В моей системе большое внимание уделяется асимметрии. Поэтому Перекрёсток 3 мы тоже рассматриваем справа и слева."]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 1. Что говорится в разделе «для чего это упражнение»?","answer":["Мы только что проверили грудную клетку, рёбра, грудину и плечевой пояс. Шея является связующим участком между головой и туловищем."]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 2. Почему начинаем именно с поворота головы?","answer":["Попробуйте повернуть голову вправо. В движении участвует шейный отдел позвоночника."]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 3. Что следует проверить до упражнения?","answer":["Ноги можно слегка согнуть в коленях, если так удобнее пояснице. Руки лежат свободно вдоль туловища."]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 4. Что говорится в разделе «не ищите максимальную амплитуду»?","answer":["Нам не нужно узнать, насколько далеко вы способны повернуть голову. Нам нужно почувствовать качество движения."]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 5. Что проверяем?","answer":["Сравните движение с тем, что было в начале. Изменилась ли разница между сторонами?"]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 6. Какие ошибки автор предлагает избегать?","answer":["Самая частая ошибка — желание повернуть голову как можно дальше. Вторая — движение через боль или выраженное сопротивление."]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 7. Что говорится в разделе «связь с перекрёстком 3»?","answer":["Почему упражнение для шеи находится в главе «Мотор и Вентиляция»? Потому что мы готовимся работать с верхней частью грудной клетки."]},{"section":"КНИГА №1. 9.4. УПРАЖНЕНИЕ 8. «ПОВОРОТЫ ГОЛОВЫ ВЛЕВО И ВПРАВО»","part":"","question":"Вопрос 8. Когда останавливаемся?","answer":["Движение прекращаем, если появляются боль, выраженное головокружение, необычное нарушение зрения, сильная тошнота, онемение или слабость. При свежей травме шеи и при медицинских ограничениях упражнение самостоятельно не выполняем."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 1. Что говорится в разделе «для чего этот приём»?","answer":["Мы подошли непосредственно к работе с нижней частью грудной клетки. До этого мы уже учились чувствовать движение живота."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 2. Почему движение идёт вверх и вправо?","answer":["Название приёма точно описывает направление движения: СЛЕВА И СНИЗУ — ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 3. Что следует проверить до упражнения?","answer":["Положите ладони на нижние рёбра справа и слева. куда преимущественно направляется дыхательное движение."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 4. Что делает вторая рука?","answer":["В моей практике вторая рука помогает создать ощущение диагонали. Если левая рука работает с левой нижней частью грудной клетки, правая может спокойно находиться на правой стороне таза."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 5. Что мы не делаем?","answer":["Особенно важно правильно понимать название и направление приёма. Не давим глубоко в левое подреберье."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 6. Что автор рекомендует сравнивать после приёма?","answer":["Полежите несколько секунд спокойно. Снова положите обе ладони на нижние рёбра."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 7. Что говорится в разделе «а если ничего не изменилось»?","answer":["Одна из главных ошибок самостоятельной работы — желание обязательно получить эффект. Если мы заранее решили, что приём обязан «освободить диафрагму», мы перестаём наблюдать и начинаем подгонять ощущения под ожидание."]},{"section":"КНИГА №1. 9.5. ПРИЁМ 9. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ДИАГОНАЛЬНО ВВЕРХ И ВПРАВО»","part":"","question":"Вопрос 8. Какие ошибки автор предлагает избегать?","answer":["Первая ошибка — слишком сильное давление. Вторая — попытка залезть пальцами под рёберную дугу."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 1. Что говорится в разделе «от нижних рёбер — к грудине»?","answer":["В предыдущем приёме мы работали с нижней частью грудной клетки. Перед нами грудина — центральная кость передней стенки грудной клетки."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 2. Как понимать название приёма?","answer":["Название «Вытяжение горла, трахеи и бронхов с растяжением грудины» появилось в моей практической системе и сохраняется в методе «23+5». Но само движение выполняется снаружи."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 3. Что следует проверить до упражнения?","answer":["Ноги можно немного согнуть в коленях. Сделайте несколько обычных вдохов и выдохов."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 4. Что мы проверяем?","answer":["После нескольких дыхательных циклов уберите руки. Снова сделайте обычный вдох и выдох."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 5. Что говорится в разделе «важно не перепутать»?","answer":["Этот приём не является способом самостоятельно лечить заболевания трахеи, бронхов, лёгких или сердца. Мы также не определяем руками положение этих органов."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 6. Какие ошибки автор предлагает избегать?","answer":["Первая — запрокидывание головы назад. Шея должна оставаться в удобном положении."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 7. Что автор рекомендует сравнивать после приёма?","answer":["До приёма мы наблюдали дыхание и движение грудной клетки. Затем одну ладонь перенесите на грудину."]},{"section":"КНИГА №1. 9.6. ПРИЁМ 10. «ВЫТЯЖЕНИЕ ГОРЛА, ТРАХЕИ И БРОНХОВ С РАСТЯЖЕНИЕМ ГРУДИНЫ»","part":"","question":"Вопрос 8. Что говорится в разделе «связь с «мотором и вентиляцией»»?","answer":["Теперь становится понятнее, почему этот приём находится именно в Перекрёстке 3. Мы не воздействуем руками на Мотор — сердце."]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 1. Что говорится в разделе «от грудины — к рёбрам»?","answer":["В предыдущем приёме мы работали с центральной линией передней поверхности грудной клетки — с областью грудины. От грудины пойдём в стороны — к рёбрам."]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 2. Как понимать слово «растягивание»?","answer":["Название «Растягивание грудино-рёберных суставов» сохраняется в моей системе «23+5». Но это не означает, что мы должны силой раздвигать суставные поверхности или растягивать рёберные хрящи."]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 3. Что находится за этой костной конструкцией?","answer":["Почему в методе «23+5» я уделяю столько внимания грудине, рёбрам и ключицам? Потому что грудная клетка — это не просто костный футляр. Внутри неё и непосредственно рядом с её верхней апертурой располагаются важнейшие анатомические структуры:"]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 4. Что говорится в разделе «сначала найдём грудину»?","answer":["Теперь пальцами другой руки можно очень легко почувствовать её края. Именно по сторонам от грудины располагаются передние отделы рёбер и рёберные хрящи."]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 5. Что следует проверить до упражнения?","answer":["Перед началом снова сделайте то, что мы уже умеем. Положите ладони на правую и левую стороны передней поверхности грудной клетки."]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 6. Что говорится в разделе «сила здесь не нужна»?","answer":["Передняя поверхность грудной клетки чувствительна. Поэтому сильное давление здесь не даёт нам преимущества."]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 7. Что можно почувствовать?","answer":["После мягкой работы ощущения у разных людей будут различаться. Кто-то заметит, что дыхательное движение стало ощущаться иначе."]},{"section":"КНИГА №1. 9.7. ПРИЁМ 11. «РАСТЯГИВАНИЕ ГРУДИНО-РЁБЕРНЫХ СУСТАВОВ»","part":"","question":"Вопрос 8. Какие ошибки автор предлагает избегать?","answer":["Первая ошибка — сильное давление непосредственно на грудину. Вторая — попытка продавить промежуток между рёбрами."]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 1. Что говорится в разделе «от руки — к движению всего тела»?","answer":["В Приёме 9 мы уже познакомились с этим направлением. Лёжа на спине, рука мягко направляла левую нижнюю часть грудной клетки:"]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 2. Почему стоя всё ощущается иначе?","answer":["Когда человек лежит, поверхность принимает на себя значительную часть веса тела. Теперь в работу включается вся наша конструкция:"]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 3. Что следует проверить до упражнения?","answer":["Стопы расположены примерно на комфортной ширине. Колени не нужно специально выпрямлять до напряжения."]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 4. Что говорится в разделе «находим знакомую область»?","answer":["Положите левую ладонь на левую нижнюю часть грудной клетки. Почувствуйте движение рёбер под ладонью."]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 5. Что говорится в разделе «не нужно «сдвигать» рёбра»?","answer":["Название упражнения — «Перемещение левой нижней части грудной клетки вверх и вправо стоя». Но, как и в Приёме 9, слово «перемещение» является нашим рабочим обозначением направления."]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 6. Какие ошибки автор предлагает избегать?","answer":["Первая ошибка — слишком большое движение. Если человек начинает сильно скручиваться, смысл упражнения теряется."]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 7. Что автор рекомендует сравнивать после приёма?","answer":["Вернитесь в обычное положение стоя. Теперь повторите исходную проверку."]},{"section":"КНИГА №1. 9.8. УПРАЖНЕНИЕ 18. «ПЕРЕМЕЩЕНИЕ ЛЕВОЙ НИЖНЕЙ ЧАСТИ ГРУДНОЙ КЛЕТКИ ВВЕРХ И ВПРАВО СТОЯ»","part":"","question":"Вопрос 8. Что говорится в разделе «от локального приёма — к целому телу»?","answer":["Вот почему я считаю этот этап важным. Если всё время работать только руками и только лёжа, легко забыть, что человек живёт не на кушетке."]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 1. Почему я называю голову «диспетчерской»?","answer":["Здесь расположены органы зрения, слуха, равновесия, обоняния и вкуса. Через структуры нервной системы мозг получает огромный поток информации от тела и участвует в управлении движением, чувствительностью, дыханием, работой внутренних органов и множеством других функций."]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 2. Что говорится в разделе «голова стоит на шее»?","answer":["Эта фраза кажется настолько очевидной, что о ней легко забыть. Он располагается над шейным отделом позвоночника."]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 3. Что говорится в разделе «шея — мост между головой и туловищем»?","answer":["Шейный отдел позвоночника состоит из семи позвонков. Самые верхние из них имеют особое строение."]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 4. Что говорится в разделе «перекрёсток 4 начинается не с черепа»?","answer":["Это один из важных принципов моей последовательности. Мы не будем сразу хвататься за голову."]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 5. Что говорится в разделе «атлант — важный, но не «волшебный» позвонок»?","answer":["В моей системе атланту уделяется отдельное внимание. И в списке «23+5» есть приём с авторским названием:"]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 6. Что говорится в разделе «основание черепа»?","answer":["Шейный отдел подходит к основанию черепа. Здесь расположена сложная анатомическая область."]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 7. А что с сосудами?","answer":["В области шеи действительно проходят важнейшие кровеносные сосуды, участвующие в кровоснабжении головы. Но отсюда нельзя делать простой вывод:"]},{"section":"КНИГА №1. 10.1. ГОЛОВА — ДИСПЕТЧЕРСКАЯ","part":"","question":"Вопрос 8. Что говорится в разделе «череп — не неподвижный шлем, но и не конструктор для самокоррекции»?","answer":["Череп взрослого человека образован несколькими костями, соединёнными преимущественно швами. Эти соединения имеют сложное строение."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 1. Где находится перекрёсток 4?","answer":["Если в предыдущих Перекрёстках мы двигались снизу вверх по нашему «телесному зданию», то сейчас дошли до области, где встречаются: ГОЛОВА — ОСНОВАНИЕ ЧЕРЕПА — ШЕЯ — ВЕРХНЯЯ ЧАСТЬ ГРУДНОЙ КЛЕТКИ."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 2. Почему это перекрёсток?","answer":["Посмотрите, сколько разных задач встречается в этой небольшой области. Голова должна сохранять положение относительно туловища."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 3. Что говорится в разделе «четыре перекрёстка — одна система»?","answer":["Теперь можно посмотреть на всю карту целиком. Затем к диафрагме и грудной клетке."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 4. Где здесь «линия болезни»?","answer":["В главе 4 мы познакомились с моей авторской моделью Линии Болезни. Теперь мы добрались до её верхней части."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 5. Что говорится в разделе «перекрёсток 4 и шея»?","answer":["Шея становится главным мостом этого Перекрёстка. Снизу она связана с грудным отделом и плечевым поясом."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 6. Что говорится в разделе «перекрёсток 4 и атлант»?","answer":["Первый шейный позвонок — атлант — занимает особое место между черепом и остальным шейным отделом. Именно поэтому в моей системе ему посвящён отдельный приём."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 7. Что говорится в разделе «перекрёсток 4 и основание черепа»?","answer":["Ещё выше находится основание черепа. Анатомически это очень сложная область."]},{"section":"КНИГА №1. 10.2. ПЕРЕКРЁСТОК 4","part":"","question":"Вопрос 8. Что говорится в разделе «перекрёсток 4 и череп»?","answer":["Дальше наши руки перейдут непосредственно к голове. И здесь появятся ещё более необычные названия:"]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 1. Что говорится в разделе «начинаем перекрёсток 4 снизу»?","answer":["Мы подошли к практической части Перекрёстка 4. А снизу — с места, где шея встречается с верхней частью грудного отдела позвоночника."]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 2. Как понимать название приёма?","answer":["Название сохраняется таким, каким оно существует в моей системе «23+5»: «Смещение шейно-грудных позвонков справа диагонально вверх и влево»."]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 3. Что говорится в разделе «сначала — проверка»?","answer":["Не вытягивайте позвоночник специально. Не старайтесь принять «идеальную осанку»."]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 4. Где находится рабочая область?","answer":["Проведите рукой по задней поверхности шеи вниз. Там, где шея переходит в верхнюю часть спины, начинается интересующая нас область."]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 5. Что автор рекомендует сравнивать после приёма?","answer":["Используйте примерно тот же комфортный диапазон, что и до приёма. Не пытайтесь доказать, что теперь голова поворачивается дальше."]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 6. Что говорится в разделе «не ищем «вставший на место позвонок»»?","answer":["После приёма может появиться ощущение, что движение стало другим. Именно оно и является нашим функциональным тестом."]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 7. Что говорится в разделе «если ничего не изменилось»?","answer":["Не повторяйте приём с большей силой. «Первый раз не помогло — значит, нужно сильнее»."]},{"section":"КНИГА №1. 10.3. ПРИЁМ 12. «СМЕЩЕНИЕ ШЕЙНО-ГРУДНЫХ ПОЗВОНКОВ СПРАВА ДИАГОНАЛЬНО ВВЕРХ И ВЛЕВО»","part":"","question":"Вопрос 8. Какие ошибки автор предлагает избегать?","answer":["Первая ошибка — попытка найти конкретный «неправильный» позвонок. Вторая — сильное давление на позвоночник."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 1. Что говорится в разделе «атлант — первый шейный позвонок»?","answer":["Мы продолжаем подниматься по Перекрёстку 4. В Приёме 12 мы работали в области шейно-грудного перехода."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 2. Что говорится в разделе «немного анатомии»?","answer":["Первый шейный позвонок заметно отличается от большинства других позвонков. У него нет типичного массивного тела позвонка. По форме он напоминает костное кольцо."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 3. Почему в моей системе появился атлант?","answer":["Во время практической работы я много раз обращал внимание на различия движения головы вправо и влево, напряжение под затылком и особенности положения головы относительно шеи. Так атлант и верхняя шейная область заняли отдельное место в моей рабочей системе."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 4. Что мы называем «коррекцией»?","answer":["Мы не будем определять пальцами, «сдвинут» атлант или нет. Не будем самостоятельно вправлять его."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 5. Что говорится в разделе «сначала проверяем»?","answer":["Медленно поверните голову вправо в комфортном диапазоне. Теперь сделайте совсем небольшой кивок головой вперёд и вернитесь."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 6. Где будем работать?","answer":["Найдите пальцами заднюю поверхность головы. Медленно проведите ими вниз до нижнего края затылочной области."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 7. Что говорится в разделе «положение»?","answer":["Для самостоятельной работы удобнее выполнять этот приём лёжа на спине. Так мышцы шеи меньше заняты удержанием головы."]},{"section":"КНИГА №1. 10.4. ПРИЁМ 13. «КОРРЕКЦИЯ АТЛАНТА, ПЕРВОГО ШЕЙНОГО ПОЗВОНКА»","part":"","question":"Вопрос 8. Что автор рекомендует сравнивать после приёма?","answer":["Сделайте тот же небольшой комфортный кивок, который выполняли перед приёмом. Изменилось ли ощущение начала движения?"]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 1. Что говорится в разделе «мы подошли к основанию черепа»?","answer":["Область основания черепа — один из самых сложных анатомических участков нашего Перекрёстка 4. Здесь встречаются затылочная кость, височная кость, атлант, аксис, короткие подзатылочные мышцы, связки, фасциальные структуры, сосуды и нервы."]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 2. Что говорится в разделе «большое затылочное отверстие»?","answer":["Большое затылочное отверстие находится в затылочной кости. Через него полость черепа соединяется с позвоночным каналом. Здесь проходят жизненно важные структуры центральной нервной системы и сосуды."]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 3. Что говорится в разделе «яремное отверстие»?","answer":["По обе стороны основания черепа расположены яремные отверстия. Каждое из них образовано на границе яремных вырезок височной и затылочной костей."]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 4. Что говорится в разделе «подзатылочная область»?","answer":["Теперь посмотрим на следующий рисунок. Между затылочной костью, атлантом и аксисом располагается группа небольших глубоких мышц."]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 5. Что говорится в разделе «венозный отток»?","answer":["На рисунке венозной и лимфатической систем видно, насколько насыщена сосудами область головы и шеи. Основной венозный отток из полости черепа связан с внутричерепными венозными синусами и внутренними яремными венами."]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 6. Что говорится в разделе «лимфатическая система»?","answer":["Вокруг уха, затылка и по боковым поверхностям шеи располагается развитая сеть лимфатических сосудов и лимфатических узлов. Поэтому затылочно-шейную область полезно воспринимать не как одну точку, а как часть большой системы мягких тканей головы и шеи."]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 7. Что говорится в разделе «позвоночные артерии»?","answer":["Особенно внимательно посмотрите на рисунок подзатылочных мышц и позвоночных артерий. Позвоночные артерии поднимаются через шейный отдел позвоночника. В верхнем шейном отделе их ход становится особенно сложным: артерия проходит через область атланта, меняет направление и затем направляется в полость черепа."]},{"section":"КНИГА №1. 10.5. ПРИЁМ 14. «РАССЛАБЛЕНИЕ БОЛЬШОГО ЗАТЫЛОЧНОГО ОТВЕРСТИЯ И ЯРЕМНОГО ОТВЕРСТИЯ МЕЖДУ ВИСОЧНОЙ И ЗАТЫЛОЧНОЙ КОСТЯМИ ЧЕРЕПА СЛЕВА»","part":"","question":"Вопрос 8. Что говорится в разделе «вариант без движения»?","answer":["Лёжа на животе, обеспечьте голове и шее удобную опору. Не выполняйте массаж и растягивание."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 1. Что говорится в разделе «клиновидная кость — в центре основания черепа»?","answer":["Клиновидная кость находится глубоко в основании черепа и соединяется со многими другими костями. Она участвует в формировании основания черепа и глазниц. Рядом проходят важные нервные и сосудистые структуры."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 2. Зачем здесь глаза?","answer":["До сих пор большинство наших проверок выполнялось движением тела. Глаза постоянно участвуют в нашей ориентации в пространстве."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 3. Что говорится в разделе «сначала — проверка»?","answer":["Перед выполнением приёма сядьте удобно. Не двигая головой, спокойно посмотрите вправо."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 4. Что говорится в разделе «мягкая «фиксация»»?","answer":["Расположите руки симметрично по бокам головы в височных областях. Не пытайтесь проникнуть пальцами глубже."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 5. Что говорится в разделе «теперь — восьмёрка глазами»?","answer":["Не двигая головой, начните медленно рисовать глазами горизонтальную восьмёрку — знак бесконечности. Представьте перед собой небольшую восьмёрку."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 6. Что говорится в разделе «голова не помогает глазам»?","answer":["Когда взгляд уходит вправо или влево, голова может незаметно захотеть последовать за ним. Уменьшите размер восьмёрки настолько, чтобы голова могла спокойно оставаться на месте."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 7. Что говорится в разделе «руки не «ведут» кость»?","answer":["Пока глаза выполняют восьмёрку, руки сохраняют спокойный контакт. Не нужно двигать руками вслед за глазами."]},{"section":"КНИГА №1. 10.6. ПРИЁМ 15. «ФИКСАЦИЯ КЛИНОВИДНОЙ КОСТИ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 8. Что сказано о дыхании в этом разделе?","answer":["Не задерживайте дыхание, когда взгляд проходит верхнюю, нижнюю или боковую часть восьмёрки. Вдох и выдох не нужно специально подстраивать под движение глаз."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 1. Что говорится в разделе «теменные кости и швы черепа»?","answer":["Правая и левая теменные кости образуют значительную часть свода черепа. Между ними проходит сагиттальный шов."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 2. Как понимать название приёма?","answer":["В методе «23+5» этот приём называется: «Расслабление швов между теменными костями черепа и между теменем и лобной костью черепа»."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 3. Что говорится в разделе «сначала — проверка»?","answer":["Голова находится в привычном положении. Несколько секунд просто почувствуйте голову и шею."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 4. Что говорится в разделе «первый этап — теменная область»?","answer":["Расположите ладони по обе стороны верхней части головы в теменных областях. Сначала просто почувствуйте контакт."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 5. Что говорится в разделе «второй этап — область сагиттального шва»?","answer":["Переместите пальцы ближе к верхней средней линии головы. Здесь проходит область сагиттального шва между теменными костями."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 6. Что говорится в разделе «третий этап — лобно-теменная область»?","answer":["Теперь переместите руки немного вперёд — к границе лобной и теменных областей. Снова сначала просто положите руки."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 7. Что сказано о дыхании в этом разделе?","answer":["Во время всего приёма дыхание остаётся обычным. Не нужно специально делать глубокий вдох."]},{"section":"КНИГА №1. 10.7. ПРИЁМ 16. «РАССЛАБЛЕНИЕ ШВОВ МЕЖДУ ТЕМЕННЫМИ КОСТЯМИ ЧЕРЕПА И МЕЖДУ ТЕМЕНЕМ И ЛОБНОЙ КОСТЬЮ ЧЕРЕПА»","part":"","question":"Вопрос 8. Что говорится в разделе «убираем руки»?","answer":["После последнего контакта постепенно уменьшите давление ладоней. Несколько секунд ничего не делайте."]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 1. Что говорится в разделе «лобная и носовые кости»?","answer":["Лобная кость образует переднюю часть свода черепа и участвует в формировании верхних стенок глазниц. Носовые кости — небольшие парные кости, образующие костную часть спинки носа."]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 2. Как понимать название приёма?","answer":["В методе «23+5» этот приём называется: «Растягивание носа и лобной кости в противоположные стороны + вращение глазами в виде 8»."]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 3. Что говорится в разделе «сначала — проверка»?","answer":["Теперь один раз медленно нарисуйте глазами небольшую горизонтальную восьмёрку. не хочется ли повернуть голову вслед за глазами;"]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 4. Что говорится в разделе «противоположные направления»?","answer":["Теперь задайте руками очень небольшие противоположные направления по поверхности кожи и доступных мягких тканей. Не нужно превращать их в настоящее вытяжение головы или носа."]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 5. Что говорится в разделе «добавляем восьмёрку глазами»?","answer":["Сохраняя мягкий контакт рук, начните медленно рисовать глазами небольшую горизонтальную восьмёрку. Руки не двигаются вслед за глазами."]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 6. Что сказано о дыхании в этом разделе?","answer":["Не связывайте каждую часть восьмёрки с определённой фазой дыхания. Не усиливайте движение рук на выдохе."]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 7. Что говорится в разделе «убираем руки»?","answer":["Закройте глаза на несколько секунд. Несколько секунд спокойно полежите."]},{"section":"КНИГА №1. 10.8. ПРИЁМ 17. «РАСТЯГИВАНИЕ НОСА И ЛОБНОЙ КОСТИ В ПРОТИВОПОЛОЖНЫЕ СТОРОНЫ + ВРАЩЕНИЕ ГЛАЗАМИ В ВИДЕ 8»","part":"","question":"Вопрос 8. Что автор рекомендует сравнивать после приёма?","answer":["Теперь снова один раз выполните небольшую горизонтальную восьмёрку глазами. Сравните с первоначальной проверкой."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 1. Что говорится в разделе «для чего это упражнение»?","answer":["Крестец — один из главных элементов нашего телесного фундамента. Он образован пятью сросшимися крестцовыми позвонками и располагается в задней части таза."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 2. Что говорится в разделе «значение крестца»?","answer":["Крестец — это не просто нижний конец позвоночника. Это часть конструкции, соединяющей позвоночник и таз."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 3. Что говорится в разделе «крестец — фундамент»?","answer":["Если представить позвоночник стеной здания, то область крестца и таза действительно напоминает фундамент. Но фундамент тела не является неподвижным бетонным блоком."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 4. Что говорится в разделе «сначала — проверка»?","answer":["Не пытайтесь принять специально «правильную» осанку. Сделайте небольшой комфортный наклон туловища вперёд."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 5. Что говорится в разделе «руки не толкают кость»?","answer":["При выполнении упражнения очень легко превратить движение в попытку руками «дожать» крестец вперёд. Ладони здесь выполняют прежде всего роль ориентира и обратной связи."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 6. Что происходит с поясницей?","answer":["Когда таз немного перемещается вперёд, положение поясницы естественным образом тоже может измениться. Но нам не нужно специально увеличивать поясничный лордоз."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 7. Что говорится в разделе «колени и стопы»?","answer":["Стопы продолжают спокойно стоять на полу. Не перекатывайтесь резко на носки или пятки."]},{"section":"КНИГА №1. 11.1. УПРАЖНЕНИЕ 19. «ПЕРЕМЕЩЕНИЕ КРЕСТЦА ВПЕРЁД»","part":"","question":"Вопрос 8. Что сказано о дыхании в этом разделе?","answer":["В моей последовательности движение удобно соединять с выдохом. Но выдох не является способом «вправить» крестец и не гарантирует расслабления тазового дна."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 1. Что говорится в разделе «для чего это упражнение»?","answer":["Поясничный отдел позвоночника состоит из пяти позвонков — L1, L2, L3, L4 и L5. Это крупные позвонки, которые несут значительную часть нагрузки туловища и участвуют практически во всех движениях нижней части тела."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 2. Что говорится в разделе «поясница и внутренние органы»?","answer":["Здесь нам нужно особенно внимательно разделить анатомию и нашу рабочую модель. В поясничной и пояснично-крестцовой областях действительно находятся нервные структуры, мышцы, фасции, сосуды и другие ткани, функционально связанные с туловищем, тазом и нижними конечностями."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 3. Почему работаем снизу вверх?","answer":["В моей системе последовательность остаётся прежней: Потому что я рассматриваю тело как здание."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 4. Как понимать название упражнения?","answer":["«Перемещение поясничных позвонков вперёд». Название сохраняет направление работы в моей системе."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 5. Что говорится в разделе «сначала — проверка»?","answer":["Не пытайтесь специально выпрямить поясницу. Почувствуйте её такой, какая она сейчас."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 6. Где находятся l1–l5?","answer":["Здесь читателю не нужно с миллиметровой точностью находить каждый остистый отросток. Для самостоятельной работы это и не требуется."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 7. Что говорится в разделе «руки — ориентир, а не домкрат»?","answer":["Здесь особенно хорошо работает образ из нашего телесного дома. Руки не являются домкратом, которым мы выталкиваем кирпич стены обратно."]},{"section":"КНИГА №1. 11.2. УПРАЖНЕНИЕ 20. «ПЕРЕМЕЩЕНИЕ ПОЯСНИЧНЫХ ПОЗВОНКОВ ВПЕРЁД»","part":"","question":"Вопрос 8. Что говорится в разделе «последовательность l5 — l1»?","answer":["После нескольких мягких движений на нижнем уровне переместите руки немного выше. Так постепенно пройдите поясничную область снизу вверх:"]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 1. Что говорится в разделе «три сустава — одна цепь»?","answer":["Тазобедренный, коленный и голеностопный суставы — три важнейших звена движения нижней конечности. Но человек не ходит отдельно тазобедренным суставом, отдельно коленом и отдельно голеностопом."]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 2. Что говорится в разделе «голеностопный сустав — связь ноги со стопой»?","answer":["Голеностопный сустав участвует в движении стопы относительно голени и играет важную роль при ходьбе, поддержании равновесия и переносе нагрузки. Когда мы делаем шаг, стопа взаимодействует с поверхностью, а голеностоп участвует в адаптации ноги к этому движению."]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 3. Что говорится в разделе «коленный сустав — середина цепи»?","answer":["Его нельзя представлять просто как петлю, которая только сгибается и разгибается. Оно должно сочетаться с работой тазобедренного сустава, голеностопа и стопы."]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 4. Что говорится в разделе «тазобедренный сустав — мост между ногами и тазом»?","answer":["Ещё выше расположен тазобедренный сустав. Это крупный сустав, соединяющий бедренную кость с тазом."]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 5. Что говорится в разделе «три сустава работают вместе»?","answer":["Теперь снова посмотрим на всю ногу. СТОПА — ГОЛЕНОСТОП — КОЛЕНО — ТАЗОБЕДРЕННЫЙ СУСТАВ — ТАЗ."]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 6. Что говорится в разделе «мышцы — двигатели и стабилизаторы»?","answer":["Третьи отводят или приводят конечность. Некоторые особенно важны для стабилизации сустава и управления движением."]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 7. Что происходит, если мы мало двигаемся?","answer":["Здесь тоже не нужна страшная схема неизбежного разрушения. Но длительное снижение физической активности действительно может сопровождаться уменьшением мышечной силы и выносливости, ухудшением способности выполнять привычные движения и снижением уверенности при ходьбе."]},{"section":"КНИГА №1. 12.1. ПОЧЕМУ СОСТОЯНИЕ НОГ ВАЖНО ДЛЯ ВСЕГО ТЕЛА","part":"","question":"Вопрос 8. А что же внутренние органы?","answer":["Для этой книги вопрос принципиальный. Название метода и вся наша Линия Болезни постоянно возвращают нас к взаимодействию разных частей тела."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 1. Что говорится в разделе «помощь тазу, тазобедренному суставу и колену»?","answer":["Мы начинаем заключительную часть основных упражнений метода «23+5». И начинаем её не со стопы, а с бедра."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 2. Что говорится в разделе «для чего это упражнение»?","answer":["Приводящие мышцы бедра — это не одна мышца, а группа мышц внутренней поверхности бедра. Их основная функция понятна уже из названия — они участвуют в приведении бедра, то есть в движении ноги к средней линии тела."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 3. Почему начинаем с левой стороны?","answer":["В последовательности метода «23+5» Упражнение 21 называется: «МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА»."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 4. Что говорится в разделе «приводящие мышцы и таз»?","answer":["Приводящие мышцы соединяют бедренную кость с тазом и участвуют в управлении положением бедра. Поэтому изменение их напряжения может сопровождаться изменением ощущений при движении ноги, таза или тазобедренного сустава."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 5. Что говорится в разделе «а как же внутренние органы»?","answer":["Внутренняя поверхность бедра анатомически расположена рядом с паховой областью и тазом. Но из этого нельзя делать вывод, что массаж приводящих мышц непосредственно улучшает кровоснабжение или иннервацию кишечника, мочевого пузыря, предстательной железы или других органов малого таза."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 6. Что говорится в разделе «сначала — проверка»?","answer":["Прежде чем начинать массаж, встаньте и сделайте несколько обычных шагов. Не пытайтесь идти специально правильно."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 7. Что говорится в разделе «найдите рабочую область»?","answer":["Положите ладонь на внутреннюю поверхность левого бедра. Проведите ею от области немного выше внутренней стороны колена вверх по бедру."]},{"section":"КНИГА №1. 12.2. УПРАЖНЕНИЕ 21. МАССАЖ ПРИВОДЯЩИХ МЫШЦ ЛЕВОГО БЕДРА","part":"","question":"Вопрос 8. Что говорится в разделе «первый этап — знакомство с тканями»?","answer":["Сначала просто положите ладонь на внутреннюю поверхность бедра. Медленно переместите ладонь немного выше."]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 1. Что говорится в разделе «для чего это упражнение»?","answer":["Задняя поверхность голени — мощная мышечная область. Здесь располагаются икроножная и камбаловидная мышцы, а глубже — другие мышцы задней группы голени."]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 2. Что говорится в разделе «икроножная и камбаловидная мышцы»?","answer":["Икроножная мышца образует хорошо заметную верхнюю часть икры. Она начинается выше коленного сустава и поэтому связана движением не только с голеностопом, но и с коленом."]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 3. Почему снова левая нога?","answer":["В методе «23+5» Упражнение 22 называется: Как и в предыдущем упражнении, левая сторона является частью моей последовательности работы."]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 4. Что говорится в разделе «голень и «мышечная помпа»»?","answer":["Здесь есть ещё одна интересная анатомическая особенность. При движении мышцы голени сокращаются и расслабляются. Вместе с венозными клапанами эта работа помогает продвижению венозной крови от нижних конечностей обратно к сердцу."]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 5. Что говорится в разделе «сначала — проверка»?","answer":["До массажа встаньте и сделайте несколько обычных шагов. Как пятка встречается с поверхностью?"]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 6. Что говорится в разделе «найдите рабочую область»?","answer":["Положите ладони на заднюю поверхность левой голени. Сверху ориентиром служит область ниже колена."]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 7. Что говорится в разделе «первый этап — знакомство с голенью»?","answer":["Сначала просто положите руки на икру. Сравните наружную и внутреннюю части."]},{"section":"КНИГА №1. 12.3. УПРАЖНЕНИЕ 22. «МАССАЖ ЗАДНИХ МЫШЦ ЛЕВОЙ ГОЛЕНИ»","part":"","question":"Вопрос 8. Что говорится в разделе «второй этап — продольный массаж»?","answer":["Начните с нижней части мышечной области голени. Ладонями или мягкой поверхностью пальцев медленно двигайтесь вверх."]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 1. Что говорится в разделе «для чего это упражнение»?","answer":["Передняя и наружная части голени содержат мышцы, участвующие в движении стопы и пальцев. Особенно хорошо можно почувствовать работу передней большеберцовой мышцы."]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 2. Что говорится в разделе «стопа — наш фундамент»?","answer":["Мы уже говорили об этом в начале книги. Стопа — место непосредственного контакта тела с опорой."]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 3. Почему работаем с левой стороной?","answer":["Название Упражнения 23 сохраняем полностью: «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»."]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 4. Что мы будем делать?","answer":["Упражнение состоит из двух связанных частей. Сначала работаем с мышцами передней поверхности левой голени."]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 5. Что говорится в разделе «сначала — проверка»?","answer":["Теперь сделайте несколько обычных шагов. Как левая пятка касается поверхности?"]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 6. Что говорится в разделе «первый этап — передняя поверхность голени»?","answer":["Положите ладонь или мягкие поверхности пальцев на передненаружную часть левой голени. Не давите непосредственно на передний край большеберцовой кости."]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 7. Что говорится в разделе «второй этап — мягкий массаж голени»?","answer":["Начните с верхней части доступной мышечной области и постепенно двигайтесь вниз. Можно использовать небольшие круговые движения по наружным тканям."]},{"section":"КНИГА №1. 12.4. УПРАЖНЕНИЕ 23. «МАССАЖ МЫШЦ ЛЕВОЙ ГОЛЕНИ СПЕРЕДИ И ТЫЛА ЛЕВОЙ СТОПЫ»","part":"","question":"Вопрос 8. Что говорится в разделе «третий этап — область голеностопа»?","answer":["Приближаясь к голеностопу, уменьшите давление. Здесь под кожей расположено много сухожилий и костных ориентиров."]},{"section":"КНИГА №1. ГЛАВА 13. +5 «ВОСЬМЁРОК». ВРАЩЕНИЕ ТЕЛЕСНЫМИ ОТДЕЛАМИ","part":"","question":"Вопрос 1. Что говорится в разделе «интеграция всех перекрёстков: от таза до глаз»?","answer":["Двадцать три основных упражнения и приёма закончены. Теперь начинается вторая часть формулы — +5 «восьмёрок»."]},{"section":"КНИГА №1. ГЛАВА 13. +5 «ВОСЬМЁРОК». ВРАЩЕНИЕ ТЕЛЕСНЫМИ ОТДЕЛАМИ","part":"","question":"Вопрос 2. Что говорится в разделе «для чего нужны «восьмёрки»»?","answer":["В обычной жизни тело почти никогда не движется только в одной плоскости. Когда человек идёт, поворачивается, переносит вес, тянется рукой или меняет направление движения, разные отделы тела работают одновременно."]},{"section":"КНИГА №1. ГЛАВА 13. +5 «ВОСЬМЁРОК». ВРАЩЕНИЕ ТЕЛЕСНЫМИ ОТДЕЛАМИ","part":"","question":"Вопрос 3. Почему именно пять «восьмёрок»?","answer":["Потому что в моей системе мы последовательно работаем с пятью уровнями. Она возвращает нас к Перекрёстку 1 и к фундаменту движения."]},{"section":"КНИГА №1. ГЛАВА 13. +5 «ВОСЬМЁРОК». ВРАЩЕНИЕ ТЕЛЕСНЫМИ ОТДЕЛАМИ","part":"","question":"Вопрос 4. Что говорится в разделе «общие правила выполнения»?","answer":["Все пять «восьмёрок» выполняются медленно. Если движение свободное и комфортное, амплитуда может немного увеличиться."]},{"section":"КНИГА №1. ГЛАВА 13. +5 «ВОСЬМЁРОК». ВРАЩЕНИЕ ТЕЛЕСНЫМИ ОТДЕЛАМИ","part":"","question":"Вопрос 5. Что говорится в разделе «движение»?","answer":["Начните с очень маленькой амплитуды. После этого движение продолжается назад и снова проходит через центр."]},{"section":"КНИГА №1. ГЛАВА 13. +5 «ВОСЬМЁРОК». ВРАЩЕНИЕ ТЕЛЕСНЫМИ ОТДЕЛАМИ","part":"","question":"Вопрос 6. Что проверяем?","answer":["Не хочется ли ускориться на одной стороне? АСИММЕТРИЯ — ЭТО ИНФОРМАЦИЯ, А НЕ ДИАГНОЗ."]},{"section":"КНИГА №1. 13.2. «ВОСЬМЁРКА» 2. СЕРЕДИНА ТУЛОВИЩА — ОБЛАСТЬ ДИАФРАГМЫ","part":"","question":"Вопрос 1. Что говорится в разделе «движение»?","answer":["Начните мягко перемещать среднюю часть туловища. Затем соедините движение в плавную восьмёрку."]},{"section":"КНИГА №1. 13.2. «ВОСЬМЁРКА» 2. СЕРЕДИНА ТУЛОВИЩА — ОБЛАСТЬ ДИАФРАГМЫ","part":"","question":"Вопрос 2. Что проверяем?","answer":["Свободно ли движется правая сторона? Не появляется ли лишний прогиб в пояснице?"]},{"section":"КНИГА №1. 13.3. «ВОСЬМЁРКА» 3. ГОЛОВА — ШЕЯ","part":"","question":"Вопрос 1. Что говорится в разделе «движение»?","answer":["Начните вести носом по небольшой восьмёрке. Голова немного идёт вправо и вперёд."]},{"section":"КНИГА №1. 13.3. «ВОСЬМЁРКА» 3. ГОЛОВА — ШЕЯ","part":"","question":"Вопрос 2. Что говорится в разделе «главное правило»?","answer":["Если появляется боль, выраженное головокружение, тошнота или нарушение зрения, движение прекращаем. Не уменьшаем симптом ценой ещё нескольких повторений."]},{"section":"КНИГА №1. 13.4. «ВОСЬМЁРКА» 4. ГОЛОВА, СКЛОНЁННАЯ ВПЕРЁД — ЗАТЫЛОЧНО-ШЕЙНАЯ ОБЛАСТЬ","part":"","question":"Вопрос 1. Что говорится в разделе «движение»?","answer":["Из этого положения выполните очень маленькую восьмёрку головой. Движение происходит в комфортном диапазоне шеи и затылочно-шейного перехода."]},{"section":"КНИГА №1. 13.4. «ВОСЬМЁРКА» 4. ГОЛОВА, СКЛОНЁННАЯ ВПЕРЁД — ЗАТЫЛОЧНО-ШЕЙНАЯ ОБЛАСТЬ","part":"","question":"Вопрос 2. Что можно почувствовать?","answer":["Может измениться ощущение напряжения под затылком. Может появиться чувство большей свободы движения."]},{"section":"КНИГА №1. 13.5. «ВОСЬМЁРКА» 5. ГЛАЗА","part":"","question":"Вопрос 1. Что говорится в разделе «движение»?","answer":["Не двигая головой, начните медленно вести взгляд по одной петле восьмёрки. После одной или нескольких восьмёрок:"]},{"section":"КНИГА №1. 13.5. «ВОСЬМЁРКА» 5. ГЛАЗА","part":"","question":"Вопрос 2. Что говорится в разделе «не путать с «черепным ритмом»»?","answer":["Движение глазами — это зрительно-двигательная задача. Мы не используем его как доказательство изменения «черепного ритма», движения костей черепа или ликвородинамики."]},{"section":"КНИГА №1. 13.5. «ВОСЬМЁРКА» 5. ГЛАЗА","part":"","question":"Вопрос 3. Что говорится в разделе «время выполнения»?","answer":["Весь комплекс занимает примерно 4,5–5 минут, с ориентиром около минуты на первые четыре восьмёрки и около 30 секунд на глаза. Это приблизительный ориентир, а не строгий норматив времени выполнения."]},{"section":"КНИГА №1. 13.5. «ВОСЬМЁРКА» 5. ГЛАЗА","part":"","question":"Вопрос 4. Что говорится в разделе «признаки выполнения»?","answer":["изменение ощущения правой и левой стороны; изменение ощущения шеи или затылка;"]},{"section":"КНИГА №1. 13.5. «ВОСЬМЁРКА» 5. ГЛАЗА","part":"","question":"Вопрос 5. Какие ошибки автор предлагает избегать?","answer":["Первая ошибка — слишком большая амплитуда. Третья — попытка сделать восьмёрку идеально геометрической."]},{"section":"КНИГА №1. 13.5. «ВОСЬМЁРКА» 5. ГЛАЗА","part":"","question":"Вопрос 6. Что говорится в разделе «финальная проверка»?","answer":["После пятой восьмёрки остановитесь. Если выполняли сидя — спокойно встаньте."]},{"section":"КНИГА №1. 13.5. «ВОСЬМЁРКА» 5. ГЛАЗА","part":"","question":"Вопрос 7. Какой главный вывод делает автор в этом разделе?","answer":["Но смысл метода не в количестве упражнений. Не нужно любой ценой выполнить двадцать восемь действий подряд."]},{"section":"КНИГА №1. 14.4. КАК ВЕСТИ ДНЕВНИК НА ПРАКТИКЕ","part":"","question":"Вопрос 1. Что говорится в разделе «сколиоз внутренних органов. метод самопомощи «23+5»»?","answer":["Первая книга посвящена прежде всего работе руками. В ней я рассказываю о своём методе практической самопомощи, наблюдении за телом, Перекрёстках, Линии Болезни, Правиле Гришина и обязательной проверке результата до и после действия."]},{"section":"КНИГА №1. 14.4. КАК ВЕСТИ ДНЕВНИК НА ПРАКТИКЕ","part":"","question":"Вопрос 2. Что говорится в разделе «сколиоз — не приговор. как расслабить позвоночную спираль»?","answer":["Вторая книга посвящена прежде всего движению. Здесь я рассматриваю тело как связанную двигательную систему — от стоп и ног к тазу, позвоночнику, грудной клетке, плечевому поясу, шее и голове."]},{"section":"КНИГА №1. 14.4. КАК ВЕСТИ ДНЕВНИК НА ПРАКТИКЕ","part":"","question":"Вопрос 3. Что говорится в разделе «крылья любви. сказка о том, как у каждой девочки растут самые главные крылья»?","answer":["Эта книга обращена прежде всего к девочкам и взрослым, которые находятся рядом с ними. Это сказка о любви, внутренней опоре, доброте, смелости, умении чувствовать себя и уважать другого человека."]},{"section":"КНИГА №1. 14.4. КАК ВЕСТИ ДНЕВНИК НА ПРАКТИКЕ","part":"","question":"Вопрос 4. Что говорится в разделе «крылья силы. сказка о том, как набрать силу и стать человеком»?","answer":["Эта книга обращена прежде всего к мальчикам младшего возраста. Через сказку, приключения, движение и выбор ребёнок постепенно открывает, что сила — это не только физические возможности."]},{"section":"КНИГА №1. 14.4. КАК ВЕСТИ ДНЕВНИК НА ПРАКТИКЕ","part":"","question":"Вопрос 5. Что говорится в разделе «кривая роста. история одной спины, двух книг и тысяч шагов к свободе»?","answer":["Это не руководство и не сказка, а художественная история подростка. Главная героиня узнаёт о сколиозе и сначала воспринимает диагноз как угрозу всей своей жизни. Она боится, ищет ответы, сравнивает себя с другими и ждёт того, кто сможет её «исправить»."]},{"section":"КНИГА №1. 14.4. КАК ВЕСТИ ДНЕВНИК НА ПРАКТИКЕ","part":"","question":"Вопрос 6. Что говорится в разделе «чек-лист 23+5. практический навигатор по методу самопомощи «23+5»»?","answer":["Шестая книга — это практический навигатор по методу самопомощи «23+5». Если первые две книги подробно объясняют устройство системы, её логику, авторские модели и упражнения, то здесь задача другая."]},{"section":"КНИГА №1. 14.4. КАК ВЕСТИ ДНЕВНИК НА ПРАКТИКЕ","part":"","question":"Вопрос 7. Что говорится в разделе «до встречи»?","answer":["Спасибо, что прошли этот путь вместе со мной. До встречи во второй книге — «Сколиоз — не приговор. Как расслабить позвоночную спираль»."]}]; (function(){const root=document.getElementById('ngfaq'),input=document.getElementById('ngsearch'),select=document.getElementById('ngsection'),results=document.getElementById('ngresults'),count=document.getElementById('ngcount');const sections=[...new Set(NG_DATA.map(x=>x.section))];for(const s of sections){const o=document.createElement('option');o.value=s;o.textContent=s;select.appendChild(o)}function norm(s){return String(s).toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/[^а-яa-z0-9]+/gi,' ').trim()}function render(){const query=norm(input.value),words=query.split(' ').filter(Boolean),section=select.value;const matched=NG_DATA.filter(x=>(!section||x.section===section)&&words.every(w=>norm(x.question+' '+x.answer.join(' ')+' '+x.section+' '+x.part).includes(w)));count.textContent='Найдено: '+matched.length+' из '+NG_DATA.length;results.replaceChildren();if(!matched.length){const div=document.createElement('div');div.className='empty';div.textContent='Ответ не найден. Попробуйте другие слова.';results.append(div);return}const fragment=document.createDocumentFragment();for(const e of matched.slice(0,120)){const d=document.createElement('details'),s=document.createElement('summary'),a=document.createElement('div'),m=document.createElement('div');s.textContent=e.question;a.className='answer';a.textContent=e.answer.join('\n');m.className='meta';m.textContent=e.section+(e.part?' · '+e.part:'');d.append(s,a,m);fragment.append(d)}results.append(fragment);if(matched.length>120){const note=document.createElement('p');note.className='muted';note.textContent='Показаны первые 120 ответов. Уточните запрос для остальных.';results.append(note)}}input.addEventListener('input',render);select.addEventListener('change',render);render()})();</script></body></html>
